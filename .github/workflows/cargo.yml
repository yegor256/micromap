---
# yamllint disable rule:line-length
name: cargo
'on':
  push:
  pull_request:
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - run: cargo test --all-features -- --show-output
      - run: cargo test --release --all-features -- --show-output
      - run: cargo fmt --check
      - run: cargo doc --no-deps
      - run: cargo clippy -- --no-deps
      - run: rustup toolchain install nightly
      - run: cargo install cargo-fuzz
      - run: cargo +nightly fuzz build map_operations
      - run: cargo +nightly fuzz build set_operations
      - run: cargo +nightly fuzz build edge_cases
