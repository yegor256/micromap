[package]
name = "micromap"
version = "0.0.0"
edition = "2021"
rust-version = "1.79"
repository = "https://github.com/yegor256/micromap"
description = "The fastest alternative to HashMap, for maps smaller than 20 keys"
readme = "README.md"
license = "MIT"
homepage = "https://github.com/yegor256/micromap"
keywords = ["memory", "map"]
categories = ["data-structures", "memory-management"]

[dependencies]
serde = { version = "1.0.229", optional = true, default-features = false }

[dev-dependencies]
hashbrown = "0.17.1"
heapless = "0.9.3"
rustc-hash = "2.1.3"
nohash-hasher = "0.2.0"
tinymap = "0.4.0"
linked-hash-map = "0.5.6"
linear-map = "1.2.0"
indexmap = "2.14.2"
litemap = "0.8.3"
flurry = "0.5.2"
criterion = "0.8.2"
seq-macro = "0.3.6"
rand = { version = "0.9.2", default-features = false, features = ["small_rng"] }
uuid = { version = "1.29.2", default-features = false, features = ["v4"] }
foldhash = { version = "0.2.0", default-features = false }
bincode = { version = "2.0.1", default-features = false, features = ["serde"] }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }

[features]
default = []
std = []
serde = ["dep:serde"]

# Ref: https://users.rust-lang.org/t/how-to-document-optional-features-in-api-docs/64577/3
[package.metadata.docs.rs]
all-features = true
rust-toolchain = "nightly"
rustdoc-args = ["--cfg", "docsrs"]

[[bench]]
name = "bench"
harness = false

[[test]]
name = "random"

[[test]]
name = "proptest"
